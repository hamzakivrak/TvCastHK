<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>TV Cast - Smart Player</title>
    
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- TEMEL AYARLAR --- */
        :root { --bg: #000; --panel: #18191d; --surface: #23242a; --primary: #6c5ce7; --text: #fff; --border: #2d2e36; --red: #e74c3c; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            user-select: none;
        }

        /* --- ANA OYNATICI (TÜM EKRAN) --- */
        #playerWrapper {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        video#localPlayer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            background: #000;
            z-index: 2;
        }

        /* --- DOKUNMATİK ALANLAR (ZONES) --- */
        .tap-zone { position: absolute; top: 0; bottom: 0; z-index: 10; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.3s; }
        
        .tap-zone.left-zone { left: 0; width: 15%; background: linear-gradient(to right, rgba(0,0,0,0.4), transparent); }
        .tap-zone.left-zone:hover { background: linear-gradient(to right, rgba(0,0,0,0.7), transparent); }
        
        .tap-zone.right-zone { right: 0; width: 15%; background: linear-gradient(to left, rgba(0,0,0,0.4), transparent); }
        .tap-zone.right-zone:hover { background: linear-gradient(to left, rgba(0,0,0,0.7), transparent); }
        
        .tap-zone.center-zone { left: 15%; right: 15%; width: 70%; z-index: 9; } /* Alt katmanda kalır, kontroller üste çıkar */

        .zone-hint { color: rgba(255,255,255,0.3); transition: 0.3s; }
        .tap-zone:hover .zone-hint { color: rgba(255,255,255,0.8); transform: scale(1.2); }
        .zone-hint i { font-size: 36px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }

        /* --- KONTROLLER (UI OVERLAY) --- */
        #controlsOverlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 15;
            pointer-events: none; /* Sadece içindeki butonlar tıklanabilir olsun */
            display: flex; flex-direction: column; justify-content: space-between;
            opacity: 1; transition: opacity 0.4s ease;
            background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, transparent 100%);
        }
        #controlsOverlay.hide { opacity: 0; pointer-events: none !important; }

        .top-bar {
            padding: 20px 25px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: auto;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        
        .top-title { font-weight: 600; font-size: 1.1rem; text-shadow: 0 2px 5px #000; display: flex; flex-direction: column; gap: 5px; }
        .status-badge { font-size: 0.75rem; color: var(--primary); font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }

        .center-buttons {
            display: flex; justify-content: center; align-items: center; gap: 40px;
            pointer-events: auto;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        .ctrl-btn {
            background: rgba(24, 25, 29, 0.7); border: 2px solid rgba(255,255,255,0.1);
            color: white; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            width: 60px; height: 60px; backdrop-filter: blur(5px);
            transition: all 0.2s;
        }
        .ctrl-btn:hover { background: rgba(108, 92, 231, 0.8); border-color: var(--primary); transform: scale(1.1); }
        .ctrl-btn.main { width: 85px; height: 85px; }
        .ctrl-btn i { font-size: 32px; }
        .ctrl-btn.main i { font-size: 48px; }

        /* --- ÇEKMECELER (DRAWERS) --- */
        .drawer {
            position: absolute; top: 0; bottom: 0; background: rgba(24, 25, 29, 0.95);
            backdrop-filter: blur(15px); z-index: 30; transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.05);
        }
        
        /* Sol Ayarlar Çekmecesi */
        #leftSidebar { left: 0; width: 350px; transform: translateX(-100%); border-right: 1px solid var(--border); overflow-y: auto; }
        #leftSidebar.open { transform: translateX(0); box-shadow: 10px 0 30px rgba(0,0,0,0.8); }

        /* Sağ Kanal Çekmecesi */
        #rightSidebar { right: 0; width: 320px; transform: translateX(100%); border-left: 1px solid var(--border); }
        #rightSidebar.open { transform: translateX(0); box-shadow: -10px 0 30px rgba(0,0,0,0.8); }

        .drawer-header {
            position: sticky; top: 0; background: rgba(24, 25, 29, 1); padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; z-index: 31;
        }
        
        .overlay-backdrop { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 25; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .overlay-backdrop.show { opacity: 1; pointer-events: auto; }

        /* --- MODÜLLER VE FORMLAR (SOL MENÜ İÇİN) --- */
        .settings-content { padding: 20px; }
        .module { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 15px; overflow: hidden; }
        .module-header { padding: 15px; background: rgba(255,255,255,0.03); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .module-title { font-size: 0.75rem; font-weight: 700; color: #aaa; text-transform: uppercase; margin: 0; }
        .module-body { padding: 15px; border-top: 1px solid var(--border); }
        input, textarea, select { width: 100%; background: #121212; border: 1px solid var(--border); color: #fff; border-radius: 8px; padding: 10px; box-sizing: border-box; font-family: inherit; }
        textarea { resize: none; height: 60px; margin-bottom: 10px; font-size: 0.8rem; }
        input:focus, textarea:focus, select:focus { border-color: var(--primary); outline: none; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; height: 45px; border: 1px solid var(--border); border-radius: 8px; background: #3d3e46; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn:hover { background: var(--primary); border-color: var(--primary); }
        .btn-icon { padding: 0 15px; background: #3d3e46; color: white; border-radius: 8px; cursor: pointer; border: 1px solid var(--border); }

        /* --- KANAL LİSTESİ (SAĞ MENÜ İÇİN) --- */
        .channel-list { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
        .channel-item { padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 12px; color: #ddd; transition: background 0.2s; }
        .channel-item:hover { background: rgba(255,255,255,0.05); }
        .channel-item.active { color: var(--primary); font-weight: 600; background: rgba(108, 92, 231, 0.1); border-left: 3px solid var(--primary); padding-left: 17px; }
        .c-icon { width: 30px; height: 30px; border-radius: 5px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .c-icon img { width: 100%; height: 100%; object-fit: contain; }

        /* --- GEÇİCİ KANAL İSMİ (OSD) --- */
        .osd-title { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 12px 30px; border-radius: 30px; font-size: 1.2rem; font-weight: 500; opacity: 0; transition: opacity 0.3s ease; z-index: 20; pointer-events: none; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.8); white-space: nowrap; max-width: 80%; overflow: hidden; text-overflow: ellipsis; text-align: center;}
        .osd-title.show { opacity: 1; }

        /* Mobil Optimizasyon */
        @media (max-width: 768px) {
            #leftSidebar, #rightSidebar { width: 85%; }
            .ctrl-btn { width: 50px; height: 50px; }
            .ctrl-btn.main { width: 70px; height: 70px; }
            .center-buttons { gap: 20px; }
        }
    </style>
</head>
<body>

<!-- ANA OYNATICI ALANI -->
<div id="playerWrapper">
    
    <!-- YEREL VİDEO -->
    <video id="localPlayer" playsinline></video>

    <!-- GEÇİCİ BİLGİ EKRANI (OSD) -->
    <div id="osdTitle" class="osd-title">TV Cast</div>

    <!-- KONTROLLER OVERLAY (Orta Butonlar & Üst Bar) -->
    <div id="controlsOverlay">
        <div class="top-bar">
            <div class="top-title">
                <span id="previewTitle">Kanal Seçin</span>
                <span id="pStatus" class="status-badge">Hazır</span>
            </div>
            <div style="pointer-events: auto;">
                <google-cast-launcher style="width: 28px; height: 28px; cursor: pointer;"></google-cast-launcher>
            </div>
        </div>
        
        <div class="center-buttons">
            <button class="ctrl-btn" onclick="prevCh()"><i class="material-icons-round">skip_previous</i></button>
            <button class="ctrl-btn main" id="playPauseBtn" onclick="togglePlayPause()"><i class="material-icons-round" id="playIcon">play_arrow</i></button>
            <button class="ctrl-btn" onclick="nextCh()"><i class="material-icons-round">skip_next</i></button>
        </div>
        
        <!-- Alt boşluk (Denge için) -->
        <div style="height: 60px;"></div>
    </div>

    <!-- DOKUNMATİK ALANLAR -->
    <div class="tap-zone left-zone" onclick="openLeftSidebar()">
        <div class="zone-hint"><i class="material-icons-round">settings</i></div>
    </div>
    
    <div class="tap-zone right-zone" onclick="openRightSidebar()">
        <div class="zone-hint"><i class="material-icons-round">format_list_bulleted</i></div>
    </div>
    
    <div class="tap-zone center-zone" onclick="toggleControls()"></div>

    <!-- ARKA PLAN KARARTMASI -->
    <div id="overlayBackdrop" class="overlay-backdrop" onclick="closeAllDrawers()"></div>
</div>

<!-- SOL ÇEKMECE: AYARLAR -->
<div id="leftSidebar" class="drawer">
    <div class="drawer-header">
        <span style="color: white; font-weight: 600; font-size: 1.1rem;">Ayarlar & Yükleme</span>
        <i class="material-icons-round" onclick="closeAllDrawers()" style="color: var(--red); cursor: pointer; font-size: 24px;">close</i>
    </div>
    
    <div class="settings-content">
        <div class="module">
            <div class="module-header" style="cursor:default;">
                <p class="module-title" style="color:white;">Hazır Listeler</p>
            </div>
            <div class="module-body" style="padding-top:0; border:none;">
                <select id="countrySelect" onchange="changeCountry()">
                    <option value="tr" selected>🇹🇷 Türkiye (Varsayılan)</option>
                    <option value="https://i.mjh.nz/SamsungTVPlus/tr.m3u8">🎬 Yeşilçam & Sinema (TR)</option>
                    <option value="us">🇺🇸 USA</option>
                    <option value="uk">🇬🇧 UK</option>
                    <option value="de">🇩🇪 Germany</option>
                </select>
                <div id="status" style="font-size:0.75rem; text-align:center; margin-top:10px; color:#2ecc71;">Liste Bekleniyor...</div>
            </div>
        </div>

        <div class="module">
            <div class="module-header" onclick="toggleModule('mod-manual')">
                <p class="module-title">Manuel Link Yükle</p>
                <i class="material-icons-round icon-state">expand_more</i>
            </div>
            <div id="mod-manual" class="module-body" style="display:none;">
                <textarea id="inputData" placeholder="Script kodunu veya Linki yapıştır..."></textarea>
                <div class="btn-group">
                    <button class="btn" onclick="pasteClip()"><i class="material-icons-round">content_paste</i></button>
                    <button class="btn" style="background:var(--primary)" onclick="manualLoad()">Yükle</button>
                </div>
            </div>
        </div>
        
        <div class="module">
            <div class="module-header" onclick="toggleModule('mod-github')">
                <p class="module-title">GitHub'da Ara</p>
                <i class="material-icons-round icon-state">expand_more</i>
            </div>
            <div id="mod-github" class="module-body" style="display:none;">
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="searchTerm" placeholder="Örn: Spor...">
                    <button class="btn-icon" onclick="doSearch()"><i class="material-icons-round">search</i></button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- SAĞ ÇEKMECE: KANAL LİSTESİ -->
<div id="rightSidebar" class="drawer">
    <div class="drawer-header">
        <span style="color: white; font-weight: 600; font-size: 1.1rem;" id="listCountTitle">Kanallar</span>
        <i class="material-icons-round" onclick="closeAllDrawers()" style="color: var(--red); cursor: pointer; font-size: 24px;">close</i>
    </div>
    
    <div style="padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.05);">
        <input type="text" id="filterInput" placeholder="Kanal ara..." onkeyup="performSearch()" style="padding: 8px; font-size: 0.85rem;">
    </div>
    
    <div id="channelList" class="channel-list">
        <!-- JS İLE DOLDURULACAK -->
    </div>
</div>

<script>
    // --- GENEL DEĞİŞKENLER ---
    let allChannels = [];
    let curIdx = -1;
    let hls = null;
    let controlsTimer;
    let osdTimer;
    let remotePlayer, remoteController;
    const DEFAULT_LIST = "https://iptv-org.github.io/iptv/countries/tr.m3u";

    // --- BAŞLANGIÇ ---
    window.addEventListener('DOMContentLoaded', () => {
        loadUrl(DEFAULT_LIST, "TR Listesi Hazır!");
        resetControlsTimer();
        
        // Video eventleri (İkonları güncellemek için)
        const vid = document.getElementById('localPlayer');
        vid.addEventListener('play', () => document.getElementById('playIcon').innerText = 'pause');
        vid.addEventListener('pause', () => document.getElementById('playIcon').innerText = 'play_arrow');
        vid.addEventListener('playing', () => document.getElementById('playIcon').innerText = 'pause');
    });

    // --- ARAYÜZ KONTROLLERİ ---
    function openLeftSidebar() {
        document.getElementById('leftSidebar').classList.add('open');
        document.getElementById('overlayBackdrop').classList.add('show');
        document.getElementById('controlsOverlay').classList.add('hide'); // Menü açıkken kontrolleri gizle
    }

    function openRightSidebar() {
        document.getElementById('rightSidebar').classList.add('open');
        document.getElementById('overlayBackdrop').classList.add('show');
        document.getElementById('controlsOverlay').classList.add('hide');
        
        // Aktif kanalı görünüme kaydır
        if(curIdx !== -1) {
            const activeItem = document.getElementById(`c-${curIdx}`);
            if(activeItem) {
                setTimeout(() => {
                    document.getElementById('channelList').scrollTo({
                        top: activeItem.offsetTop - 100,
                        behavior: 'smooth'
                    });
                }, 100); // Çekmece açılma animasyonu sonrası
            }
        }
    }

    function closeAllDrawers() {
        document.getElementById('leftSidebar').classList.remove('open');
        document.getElementById('rightSidebar').classList.remove('open');
        document.getElementById('overlayBackdrop').classList.remove('show');
        resetControlsTimer(); // Kontrolleri geri getir
    }

    function toggleModule(bodyId) {
        var body = document.getElementById(bodyId);
        body.style.display = (body.style.display === "none") ? "block" : "none";
    }

    // --- KONTROL ARAYÜZÜNÜ GİZLEME/GÖSTERME ---
    function toggleControls() {
        const ctrl = document.getElementById('controlsOverlay');
        if (ctrl.classList.contains('hide')) {
            ctrl.classList.remove('hide');
            resetControlsTimer();
        } else {
            ctrl.classList.add('hide');
            clearTimeout(controlsTimer);
        }
    }

    function resetControlsTimer() {
        const ctrl = document.getElementById('controlsOverlay');
        ctrl.classList.remove('hide');
        clearTimeout(controlsTimer);
        // Eğer çekmecelerden biri açıksa saklama
        if(document.getElementById('leftSidebar').classList.contains('open') || document.getElementById('rightSidebar').classList.contains('open')) return;
        
        controlsTimer = setTimeout(() => {
            ctrl.classList.add('hide');
        }, 4000); // 4 saniye sonra gizle
    }

    // Herhangi bir yere dokununca sayacı sıfırla
    document.getElementById('playerWrapper').addEventListener('mousemove', resetControlsTimer);
    document.getElementById('playerWrapper').addEventListener('touchstart', resetControlsTimer);

    function showOSD(name, subtitle = "") {
        const osd = document.getElementById('osdTitle');
        osd.innerHTML = `${name} <div style="font-size:0.8rem; color:#aaa; margin-top:5px; font-weight:400;">${subtitle}</div>`;
        osd.classList.add('show');
        clearTimeout(osdTimer);
        osdTimer = setTimeout(() => osd.classList.remove('show'), 3000);
    }

    // --- CAST (TV YANSITMA) KURULUMU ---
    window['__onGCastApiAvailable'] = function(isAvailable) {
        if (isAvailable) {
            cast.framework.CastContext.getInstance().setOptions({
                receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
                autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
            });
            remotePlayer = new cast.framework.RemotePlayer();
            remoteController = new cast.framework.RemotePlayerController(remotePlayer);
            
            remoteController.addEventListener(cast.framework.RemotePlayerEventType.IS_CONNECTED_CHANGED, () => {
                if (remotePlayer.isConnected) {
                    document.getElementById('pStatus').innerText = "TV'ye Bağlı";
                    if(curIdx !== -1) play(curIdx); 
                } else {
                    document.getElementById('pStatus').innerText = "Cihazda İzleniyor";
                }
            });
            
            // TV'deki duraklatma bilgisini arayüze senkronize et
            remoteController.addEventListener(cast.framework.RemotePlayerEventType.IS_PAUSED_CHANGED, () => {
                if(remotePlayer.isConnected) {
                    document.getElementById('playIcon').innerText = remotePlayer.isPaused ? 'play_arrow' : 'pause';
                }
            });
        }
    };

    // --- ORTA PLAY/PAUSE BUTONU MANTIĞI ---
    function togglePlayPause() {
        if (remotePlayer && remotePlayer.isConnected) {
            // TV'yi kontrol et
            remoteController.playOrPause();
        } else {
            // Cihazı kontrol et
            const vid = document.getElementById('localPlayer');
            if (vid.paused) {
                vid.play();
            } else {
                vid.pause();
            }
        }
    }

    // --- LİSTE VERİ İŞLEMLERİ ---
    function changeCountry() {
        const val = document.getElementById('countrySelect').value;
        let url = val.startsWith('http') ? val : `https://iptv-org.github.io/iptv/countries/${val}.m3u`;
        loadUrl(url, "Liste Hazır!");
    }

    async function pasteClip() { 
        try { document.getElementById('inputData').value = await navigator.clipboard.readText(); } catch(e) {} 
    }

    function manualLoad() {
        let val = document.getElementById('inputData').value.trim();
        if(!val) return;
        if (val.includes('<script') && val.includes('src=')) { let m = val.match(/src=["'](.*?)["']/); if(m) val = m[1]; }
        if (val.includes('gist.github.com')) { val = val.replace('.js', '').replace('gist.github.com', 'gist.githubusercontent.com'); if (!val.endsWith('/raw')) val += '/raw'; loadUrl(val, "Gist Yükleniyor..."); return; }
        if(val.startsWith('http')) loadUrl(val, "Özel Liste Yüklendi"); else parse(val);
    }

    async function loadUrl(url, msg) {
        const stat = document.getElementById('status'); stat.innerText = "Yükleniyor...";
        if(url.includes('github.com') && !url.includes('gist') && !url.includes('raw') && !url.includes('user')) url = url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
        try {
            let res = await fetch(url);
            if(!res.ok) res = await fetch('https://corsproxy.io/?' + encodeURIComponent(url));
            if(!res.ok) throw new Error("Hata");
            const text = await res.text(); parse(text); stat.innerText = msg;
            showOSD("Liste Yüklendi", "Kanalları sağdan seçebilirsiniz");
        } catch(e) { stat.innerText = "Hata: Link açılamadı"; }
    }

    function parse(text) {
        allChannels = [];
        const lines = text.split('\n'); let info = {};
        for (let line of lines) {
            line = line.trim(); if(!line || line.includes('<') || line.includes('{')) continue;
            if (line.startsWith("#EXTINF")) {
                let comma = line.lastIndexOf(',');
                info = { name: (comma !== -1) ? line.substring(comma+1).trim() : "Kanal", logo: (line.match(/tvg-logo="([^"]*)"/)||[])[1] };
            } else if (line.startsWith("http") && info.name) {
                allChannels.push({ ...info, url: line }); info = {};
            }
        }
        document.getElementById('listCountTitle').innerText = `${allChannels.length} Kanal`;
        renderList(allChannels);
    }

    function renderList(list) {
        const container = document.getElementById('channelList');
        container.innerHTML = ""; 

        list.slice(0, 1000).forEach((ch, i) => {
            const item = document.createElement('div'); 
            item.className = `channel-item ${i===curIdx ? 'active' : ''}`; 
            item.id = `c-${i}`;
            item.onclick = () => { play(i); closeAllDrawers(); }; 
            
            let img = `<div class="c-icon"><i class="material-icons-round" style="font-size:16px;">tv</i></div>`;
            if(ch.logo) img = `<div class="c-icon"><img src="${ch.logo}" onerror="this.onerror=null; this.parentNode.innerHTML='<i class=\'material-icons-round\' style=\'font-size:16px;\'>tv</i>'"></div>`;
            
            item.innerHTML = `${img} <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${ch.name}</span>`;
            container.appendChild(item);
        });
    }

    function performSearch() {
        const term = document.getElementById('filterInput').value.toLowerCase();
        const items = document.querySelectorAll('.channel-item');
        items.forEach(item => {
            const name = item.innerText.toLowerCase();
            item.style.display = name.includes(term) ? 'flex' : 'none';
        });
    }

    function doSearch() {
        let term = document.getElementById('searchTerm').value.trim();
        if(!term) term = "iptv list";
        window.open(`https://www.google.com/search?q=${encodeURIComponent('site:github.com "EXTM3U" ' + term)}`, '_blank');
    }

    // --- OYNATMA MANTIĞI ---
    function play(idx) {
        if(idx < 0 || idx >= allChannels.length) return;
        curIdx = idx; const ch = allChannels[idx];
        
        // Listede aktif olanı vurgula
        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
        const activeItem = document.getElementById(`c-${idx}`);
        if(activeItem) activeItem.classList.add('active');
        
        // Üst bar başlığını güncelle
        document.getElementById('previewTitle').innerText = ch.name; 
        
        // Cihazda Oynat
        playLocally(ch.url);

        // TV'ye bağlıysa Oraya da Gönder
        if (remotePlayer && remotePlayer.isConnected) {
            document.getElementById('pStatus').innerText = "TV'ye Aktarılıyor...";
            showOSD(ch.name, "TV'de Oynatılıyor");
            
            const media = new chrome.cast.media.MediaInfo(ch.url, 'application/x-mpegurl');
            media.metadata = new chrome.cast.media.GenericMediaMetadata();
            media.metadata.title = ch.name;
            if(ch.logo) media.metadata.images = [new chrome.cast.Image(ch.logo)];
            const req = new chrome.cast.media.LoadRequest(media);
            req.autoplay = true;
            
            cast.framework.CastContext.getInstance().getCurrentSession().loadMedia(req).then(()=>{
                document.getElementById('pStatus').innerText = "TV'de Oynatılıyor";
            }).catch(() => {
                document.getElementById('pStatus').innerText = "Hata Oluştu";
            });
        } else {
            document.getElementById('pStatus').innerText = "Cihazda İzleniyor";
            showOSD(ch.name);
        }
        
        resetControlsTimer();
    }

    function playLocally(url) {
        const video = document.getElementById('localPlayer');
        if (hls) hls.destroy();

        if (Hls.isSupported()) {
            hls = new Hls(); 
            hls.loadSource(url); 
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url; 
            video.addEventListener('loadedmetadata', function() { video.play(); });
        }
    }

    function nextCh() { if(allChannels.length) play(curIdx+1 >= allChannels.length ? 0 : curIdx+1); }
    function prevCh() { if(allChannels.length) play(curIdx-1 < 0 ? allChannels.length-1 : curIdx-1); }
</script>

</body>
</html>
